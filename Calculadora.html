<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        *{
            margin:0;
            padding: 0;
        }
        .fundo{
            background-image: linear-gradient(45deg,black,rgb(216, 176, 184));
            height:100vh;
            color: white;
            font-family: Arial;
            text-align: center;
        }
        .calculadora{
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
        }
        .botao{
            width: 50px;
            height: 50px;
            font-size: 25px;
            cursor: pointer;
            margin: 3px;
            background-color: rgb(31,31,31);
            border: none;
            color: #fff;
        }
        .botao:hover{
            background-color: aqua;
        }
        #resultado{
            background-color: white;
            width: 207px;
            height: 30px;
            margin: 5px;
            font-size: 25px;
            color: brown;
            text-align: right;
            padding: 5px;
        }



    </style>
</head>
<body>
    <div class="fundo">
        <h1>Vando Ramos</h1>
        <div class="calculadora">
            <h1>Calculadora</h1>
            <p id="resultado"></p>

            <table>
                <tr>
                    <td><button class="botao" data-action="clear">C</button></td>
                    <td><button class="botao" data-action="backspace">&larr;</button></td>
                    <td><button class="botao" data-action="percent">%</button></td>
                    <td><button class="botao" data-value="/">/</button></td>
                </tr>
                <tr>
                    <td><button class="botao" data-value="7">7</button></td>
                    <td><button class="botao" data-value="8">8</button></td>
                    <td><button class="botao" data-value="9">9</button></td>
                    <td><button class="botao" data-value="*">*</button></td>
                </tr>
                <tr>
                    <td><button class="botao" data-value="4">4</button></td>
                    <td><button class="botao" data-value="5">5</button></td>
                    <td><button class="botao" data-value="6">6</button></td>
                    <td><button class="botao" data-value="-">-</button></td>
                </tr>
                <tr>
                    <td><button class="botao" data-value="1">1</button></td>
                    <td><button class="botao" data-value="2">2</button></td>
                    <td><button class="botao" data-value="3">3</button></td>
                    <td><button class="botao" data-value="+">+</button></td>
                </tr>
                <tr>
                    <td><button class="botao" data-action="toggle-sign">+/-</button></td>
                    <td><button class="botao" data-value="0">0</button></td>
                    <td><button class="botao" data-value=".">.</button></td>
                    <td><button class="botao" data-action="calculate">=</button></td>
                </tr>
            </table>

    </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Seleciona o visor e todos os botões da calculadora
            const display = document.getElementById('resultado');
            const buttons = document.querySelectorAll('.botao');

            // Adiciona um event listener para cada botão
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const action = button.dataset.action;
                    const value = button.dataset.value;

                    // Se o botão tiver um valor (número ou operador), adiciona ao visor
                    if (value) {
                        display.textContent += value;
                    }

                    // Ação para limpar o visor
                    if (action === 'clear') {
                        display.textContent = '';
                    }

                    // Ação para apagar o último caractere
                    if (action === 'backspace') {
                        display.textContent = display.textContent.slice(0, -1);
                    }

                    // Ação para calcular a porcentagem
                    if (action === 'percent') {
                        display.textContent = parseFloat(display.textContent) / 100;
                    }

                    // Ação para inverter o sinal do número
                    if (action === 'toggle-sign') {
                        display.textContent = parseFloat(display.textContent) * -1;
                    }

                    // Ação para calcular o resultado final
                    if (action === 'calculate') {
                        try {
                            // Usa o construtor Function para uma avaliação segura da expressão
                            const result = new Function('return ' + display.textContent)();
                            display.textContent = result;
                        } catch (error) {
                            // Exibe 'Erro' se a expressão for inválida
                            display.textContent = 'Erro';
                        }
                    }
                });
            });
        });
    </script>






</body>
</html>
